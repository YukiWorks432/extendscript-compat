name: Sync GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm公開済みの版番号（タグ・Releaseのみ作成）"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false
jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 実行元を確認
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = YukiWorks432/extendscript-compat
          test "$REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm公開元のタグとReleaseを補完
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/github-release.mjs "$RELEASE_VERSION"
